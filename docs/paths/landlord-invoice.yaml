/api/v1/landlord/invoice:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Get landlord invoices list
    responses:
      '200':
        description: Success
  post:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Create an invoice (multipart payload)
    requestBody:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              data:
                type: string
                description: JSON string metadata
              documents:
                type: array
                items:
                  type: string
                  format: binary
    responses:
      '201':
        description: Invoice created.

/api/v1/landlord/invoice/export:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Export invoices to CSV format
    responses:
      '200':
        description: CSV file stream.

/api/v1/landlord/invoice/export-multi:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Export invoices to multi-format (CSV, Excel, JSON)
    responses:
      '200':
        description: Success

/api/v1/landlord/invoice/statistics:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Get invoices statistics counts
    responses:
      '200':
        description: Success

/api/v1/landlord/invoice/{id}:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Get invoice details
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Success
  put:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Update invoice details
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Success
  delete:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Delete an invoice
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Success

/api/v1/landlord/invoice/{id}/comments:
  post:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Invoices)
    summary: Add comments to invoice
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/invoice.yaml#/AddCommentRequest'
    responses:
      '201':
        description: Comment posted.

/api/v1/landlord/invoice/{id}/remind:
  post:
