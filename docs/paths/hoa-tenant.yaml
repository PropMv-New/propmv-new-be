/api/v1/hoa/tenants:
  get:
    security:
      - bearerAuth: []
    tags:
      - HOA Board (Tenants)
    summary: List tenants within HOA properties
    responses:
      '200':
        description: Success
  post:
    security:
      - bearerAuth: []
    tags:
      - HOA Board (Tenants)
    summary: Add tenant profile record
    responses:
      '201':
        description: Tenant created.

/api/v1/hoa/tenants/setup:
