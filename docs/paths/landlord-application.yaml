/api/v1/landlord/application:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Screening Applications)
    summary: List screening applications
    responses:
      '200':
        description: Success
  post:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Screening Applications)
    summary: Create an application entry
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/application.yaml#/CreateApplicationRequest'
    responses:
      '201':
        description: Created.

/api/v1/landlord/application/submit/{leaseId}/{tenantId}:
  post:
    tags:
      - Landlord (Screening Applications)
    summary: Submit screening application for tenant (public link)
    parameters:
      - name: leaseId
        in: path
        required: true
        schema:
          type: string
      - name: tenantId
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Submission accepted.

/api/v1/landlord/application/submit:
  post:
    tags:
      - Landlord (Screening Applications)
    summary: Submit a generic application form (public)
    responses:
      '200':
        description: Submission accepted.

/api/v1/landlord/application/tenant/blank:
  post:
    tags:
      - Landlord (Screening Applications)
    summary: Create blank placeholder application (when tenant accepts invite)
    responses:
      '200':
        description: Placeholder created.

/api/v1/landlord/application/lease-invite-ack:
  post:
    tags:
      - Landlord (Screening Applications)
    summary: Acknowledge lease invite from deep link
    responses:
      '200':
        description: Acknowledged.

/api/v1/landlord/application/export:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Screening Applications)
    summary: Export applications list (multi-format)
    responses:
      '200':
        description: File stream.

/api/v1/landlord/application/names:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Screening Applications)
    summary: Get filter applicant names helper array
    responses:
      '200':
        description: Success

/api/v1/landlord/application/{id}/lease-screening-summary:
  get:
    security:
      - bearerAuth: []
    tags:
      - Landlord (Screening Applications)
    summary: Lease screening summary for application detail
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Success

/api/v1/landlord/application/{id}:
