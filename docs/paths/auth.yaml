/api/v1/auth/signup:
  post:
    tags:
      - Auth
    summary: Sign up a new user
    description: Registers a new user (landlord, tenant, HOA board member, etc.) along with role-specific profile details.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/SignupRequest'
    responses:
      '201':
        description: User signed up successfully.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/StandardResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ValidationError400'
      '500':
        $ref: '../components/responses/common.yaml#/ServerError500'

/api/v1/auth/login:
  post:
    tags:
      - Auth
    summary: User login
    description: Authenticates user credentials and returns access and refresh JWT tokens.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LoginRequest'
    responses:
      '200':
        description: Login successful.
        content:
          application/json:
            schema:
              type: object
              required:
                - message
                - statuscode
                - data
              properties:
                message:
                  type: string
                  example: Login successful
                statuscode:
                  type: integer
                  example: 200
                data:
                  oneOf:
                    - $ref: '../components/schemas/auth.yaml#/LoginResponse'
                    - $ref: '../components/schemas/auth.yaml#/MfaLoginRequiredResponse'

      '400':
        $ref: '../components/responses/common.yaml#/ValidationError400'
      '401':
        $ref: '../components/responses/common.yaml#/Unauthorized401'
      '500':
        $ref: '../components/responses/common.yaml#/ServerError500'

/api/v1/auth/check-identity:
  get:
    tags:
      - Auth
    summary: Check if email or phone is already registered
    parameters:
      - name: email
        in: query
        required: false
        schema:
          type: string
          format: email
      - name: phone
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: Returns registration availability state.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/StandardResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ValidationError400'

/api/v1/auth/forgot-password:
