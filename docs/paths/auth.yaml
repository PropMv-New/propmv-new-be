      - Auth
    summary: Verify reset OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyResetOtpRequest'
    responses:
      '200':
        description: OTP verified.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/StandardResponse'

/api/v1/auth/verify-otp-reset-password:
  put:
    tags:
      - Auth
    summary: Verify OTP and reset password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyOtpResetPasswordRequest'
    responses:
      '200':
        description: Password reset successful.
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/StandardResponse'

/api/v1/auth/send-mfa-otp:
  post:
    tags:
      - Auth
    summary: Send MFA OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/SendMfaOtpRequest'
    responses:
      '200':
