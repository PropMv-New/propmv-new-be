/api/v1/auth/signup-roles:
  get:
    tags:
      - Auth
    summary: List signup-eligible roles
    responses:
      '200':
        description: List of roles available for registration.

/api/v1/auth/role:
  get:
    security:
      - bearerAuth: []
    tags:
      - Auth (Roles)
    summary: List roles
    responses:
      '200':
        description: Success
  post:
    security:
      - bearerAuth: []
    tags:
      - Auth (Roles)
    summary: Create a role
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/Role'
    responses:
      '201':
        description: Role created.

/api/v1/auth/role/{id}:
  get:
    security:
      - bearerAuth: []
    tags:
      - Auth (Roles)
    summary: Get role by ID
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Success
  put:
    security:
      - bearerAuth: []
    tags:
      - Auth (Roles)
    summary: Update a role
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/Role'
    responses:
      '200':
        description: Role updated.
  delete:
    security:
      - bearerAuth: []
    tags:
      - Auth (Roles)
    summary: Delete a role
    parameters:
      - $ref: '../components/parameters/common.yaml#/idParam'
    responses:
      '200':
        description: Role deleted.

/api/v1/auth/permissions:
  get:
