        description: MFA OTP verified.

/api/v1/auth/refresh-token:
  get:
    deprecated: true
    tags:
      - Auth
    summary: Refresh JWT token (GET)
    description: >
      Deprecated: Use the POST `/api/v1/auth/refresh` endpoint instead for better security practices 
      (transmitting credentials in HTTP request body rather than query strings).
    parameters:
      - name: refreshToken
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Token refreshed.


/api/v1/auth/refresh:
  post:
    tags:
      - Auth
    summary: Refresh JWT token (POST)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/RefreshTokenRequest'
    responses:
      '200':
        description: Token refreshed.

/api/v1/auth/logout:
  post:
    security:
      - bearerAuth: []
    tags:
      - Auth
    summary: Logout user
    responses:
      '200':
        description: Logout successful.

/api/v1/auth/lock-account:
  put:
    security:
