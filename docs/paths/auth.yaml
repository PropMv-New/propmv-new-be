    tags:
      - Auth
    summary: Lock a user account (Admin only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LockAccountRequest'
    responses:
      '200':
        description: Account locked successfully.

/api/v1/auth/unlock-account:
  put:
    security:
      - bearerAuth: []
    tags:
      - Auth
    summary: Unlock a user account (Admin only)
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/LockAccountRequest'
    responses:
      '200':
        description: Account unlocked successfully.

/api/v1/auth/session:
  get:
    security:
      - bearerAuth: []
    tags:
      - Auth
    summary: Get current authenticated session details
    responses:
      '200':
        description: Current session claims returned.

/api/v1/auth/reset-password:
  put:
    security:
      - bearerAuth: []
    tags:
      - Auth
    summary: Reset password while logged in
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/ResetPasswordRequest'
