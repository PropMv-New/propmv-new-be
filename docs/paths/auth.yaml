    tags:
      - Auth (Roles)
    summary: List all system modules
    responses:
      '200':
        description: Success

/api/v1/auth/portal-invite/validate:
  get:
    tags:
      - Auth
    summary: Validate portal invitation token
    parameters:
      - name: userId
        in: query
        required: true
        schema:
          type: string
      - name: token
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Invitation verified.

/api/v1/auth/portal-invite/complete:
  post:
    tags:
      - Auth
    summary: Complete portal invitation and set password
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/PortalInviteCompleteRequest'
    responses:
      '200':
        description: Invitation accepted, user configured.

/api/v1/auth/public/masterdata:
  get:
    tags:
      - Auth
    summary: Get public master data keys
    parameters:
      - name: keys
        in: query
        required: true
        schema:
          type: string
        description: Comma-separated allowlisted keys (e.g. HOA_Association_Types)
    responses:
      '200':
        description: Success
