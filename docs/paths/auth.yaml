/api/v1/auth/verify-mfa-otp:
  post:
    tags:
      - Auth
    summary: Verify MFA OTP
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/auth.yaml#/VerifyMfaOtpRequest'
    responses:
