Tenant:
  type: object
  required:
    - firstName
    - lastName
    - email
    - phone
  properties:
    _id:
      $ref: 'common.yaml#/ObjectId'
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    address:
      type: string
    dateOfBirth:
      type: string
      format: date
    emergencyContact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        relationship:
          type: string
    documents:
      type: array
      items:
        type: string
    isArchived:
      type: boolean
    isDeleted:
      type: boolean

CreateTenantRequest:
  type: object
  required:
    - firstName
    - lastName
    - email
    - phone
  properties:
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    address:
      type: string
    dateOfBirth:
      type: string
      format: date
    emergencyContact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        relationship:
          type: string

UpdateTenantRequest:
  type: object
  properties:
    firstName:
      type: string
    lastName:
      type: string
    email:
      type: string
      format: email
    phone:
      type: string
    address:
      type: string
    dateOfBirth:
      type: string
      format: date
    emergencyContact:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        relationship:
          type: string

SetupTenantRequest:
  type: object
  required:
    - tenantId
    - password
    - confirmPassword
  properties:
    tenantId:
      type: string
    password:
      type: string
    confirmPassword:
      type: string
