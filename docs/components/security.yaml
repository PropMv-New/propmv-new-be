securitySchemes:
  bearerAuth:
    type: http
    scheme: bearer
    bearerFormat: JWT
    description: >
      JWT access token obtained from `/api/v1/auth/login` or `/api/v1/auth/refresh`.
      Include in the `Authorization` header as `Bearer <token>`.

      ### JWT Token Format:
      A JWT token consists of three parts separated by dots (.):
      `header.payload.signature`

      - **Header**: Specifies the token type (JWT) and signing algorithm (e.g., HS256).
      - **Payload**: Contains claims such as user ID (`sub`), role, privileges, and expiration times (`exp`).
      - **Signature**: Used to verify that the sender of the JWT is who it says it is and to ensure that the message wasn't changed along the way.

      ### Token Refresh Flow:
      1. Client authenticates via `/api/v1/auth/login` and receives both an `accessToken` (short-lived) and a `refreshToken` (long-lived).
      2. Client accesses protected resources using `Authorization: Bearer <accessToken>`.
      3. When the `accessToken` expires (401 Unauthorized), the client calls `/api/v1/auth/refresh` sending the `refreshToken` in the request body.
      4. The server validates the `refreshToken` and issues a new `accessToken`.

