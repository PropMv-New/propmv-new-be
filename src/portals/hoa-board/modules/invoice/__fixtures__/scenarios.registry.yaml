# HOA Invoice Edge-Case Scenario Registry
#
# Each scenario has a stable ID used across backend tests, UI parity tests, and bug reports.
# When fixing a bug: add/update an entry here BEFORE merging code.
#
# Schema:
#   id: INV-SC-NNN
#   legacyIds: [4]           # optional - old inline "scenario N" labels in test names
#   title: short description
#   tags: [fifo, credit, reversal, auto-credit, processing, waive]
#   domain: payment-allocation | payment-reversal | credit-balance | auto-credit | display
#   tests:
#     backend: path/to/test.js#test name substring
#     ui: path/to/test.ts#test name substring   # optional
#   status: covered | pending | known-failure
#   notes: free-form context

