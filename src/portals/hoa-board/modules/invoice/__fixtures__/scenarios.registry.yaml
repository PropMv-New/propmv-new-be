  - id: INV-SC-024
    title: Delete Invoice A payment after credit consumed through B–F chain; reclaim pool credit
    tags: [reversal, auto-credit, downstream-credit, fifo]
    domain: payment-reversal
    tests:
      backend: invoiceCreditAllocation.reversal.test.js#INV-SC-024
      matrix: invoiceEdgeCase.matrix.test.js#INV-SC-024 / Untitled-1
      service: invoice.service.js#deleteInvoicePayment → applyAllUnappliedCreditToDueInvoices
      ui: invoicePaymentTotals.test.ts#INV-SC-024 payment display parity
    status: covered
    notes: |
      Documented in invoice.md / Untitled-1.
      Steps: A=$100 pay $150 → credit $50; B auto-credit $50 + pay $50;
      C/D/E overdue, pay $550 on D → credit $250; F=$200 auto-credit $200 → credit $50;
      delete A $150 payment → D-pool $50 preserved and auto-applied to open due invoices.

  - id: INV-SC-026
    title: Delete recorded payment is available only on the source invoice
    tags: [fifo, allocation, reversal, display]
    domain: payment-reversal
    tests:
      backend: owners/tests/invoiceEdgeCase.matrix.test.js#INV-SC-026
      integration: invoice/service/invoicePaymentSourceGuard.integration.test.js#INV-SC-026
      ui: invoicePaymentTotals.test.ts#INV-SC-026
      component: InvoiceLayout.paymentSource.test.tsx#INV-SC-026
    status: covered
    notes: |
      A payment recorded on Invoice B may create prior_allocation rows on older Invoice A.
      Only Invoice B exposes payment deletion; direct deletion through Invoice A is rejected.

  - id: INV-SC-027
    title: Invoice list/detail hydrates current unit owners and HOA deposit bank for display and record payment
    tags: [display, owner-mapping, deposit-bank, record-payment]
    domain: display
    tests:
      backend: invoicePayerHydration.helper.test.js
      helper: hoaOnboardingStatus.helper.test.js#community deposit label
      ui: ownerInvoicesDateFilter.test.ts#this-month prior outstanding
    status: covered
    notes: |
      Unpopulated invoice.tenants and unit-level missing depositBankAccountId must not
      render "Unknown owner" or a blank deposit bank when the HOA has an active payout
      account and the unit has associated owners. Record Payment uses the same payers.

  - id: INV-SC-028
    title: FIFO allocation persists when the open-invoice scan returns lean documents
    tags: [fifo, allocation]
    domain: payment-allocation
    tests:
      backend: ledgerChronologicalPayment.test.js#INV-SC-028
    status: covered
    notes: |
      Production loadOpenAllocatableInvoicesForUnit uses .lean(). Recording $1000
      against a $110 invoice with an older $1000 opening-balance sibling must
      reload mongoose documents before save. Otherwise PUT /hoa/invoice/:id 500s
      with "inv.save is not a function".

  - id: INV-SC-025
    title: Late fees evaluate each invoice against its own due date; never charge future invoices
    tags: [late-fee, due-date, grace-period, multi-rule]
    domain: late-fee
    tests:
      backend: owners/tests/unitLateFee.test.js#INV-SC-025
      service: unitLateFee.service.js#getMaxSequenceForRule + ensureLateFeeInvoicesForUnit
    status: covered
    notes: |
      Grace=0 → first fee on dueDate+1. Future invoices (due after today) must get $0 late fee
      and no late-fee email. Past unpaid invoices remain eligible per schedule.
      Fee types: percentage-outstanding, percentage-total, flat-fee.
      Also strips premature system late fees previously applied to future invoices.

  - id: INV-SC-029
    title: Assign unverified owners without invoices; generate invoices only after verification
    tags: [owner-assignment, verification, invoice-generation]
    domain: invoice-generation
    tests:
      backend: owners/helpers/ownerEligibility.helper.test.js#INV-SC-029
      service: owners/tests/ownerVerificationInvoiceGate.test.js
      existing: owners/tests/linkOwnerToUnitsFromOwnerFlow.test.js#invitation_sent
      ui: ownerAssignmentEligibility.test.ts#INV-SC-029
      component: AddOwnerFlow.assignment.test.tsx
    status: covered
    notes: |
      Board can associate Invitation Sent, Pending Verification, Unverified, or Inactive
      owners to a unit. Invoice generation is deferred until the owner is Verified
      (portal onboarding complete and account active). If invoices already exist for
      the unit, verification must not create duplicates.

  - id: MX-MATRIX
    title: Board payment allocation / reversal matrix (MX-01 … MX-30)
    tags: [fifo, credit, reversal, matrix]
    domain: payment-allocation
    tests:
      backend: invoiceEdgeCase.matrix.test.js
      existing: ledgerChronologicalPayment.test.js (scenarios 4–23)
      existing: invoiceCreditAllocation.reversal.test.js (scenarios 7–8, 23)
    status: covered
    notes: |
      Automated unit coverage for allocation + reversal edge cases.
      UI copy: invoicePaymentRemovalCopy.test.ts (MX-24), invoiceActivityTimelineCopy.test.ts (MX-25).
      Not automated (manual/UI/e2e): MX-26 payment-method variants, MX-30 multi-entry-point parity.

  - id: INV-SC-030
    title: HOA invoice jobs and activity times use property timezone midnight, not browser/server TZ
    tags: [timezone, reminders, next-year, display, auto-credit]
    domain: display
    tests:
      backend: billingCalendar.test.js#EDT midnight
      backend: paymentReminderAutomation.service.test.js#Eastern midnight EDT
      backend: invoiceScheduleMeta.test.js#idempotency
      backend: invoiceActivityTimeline.builder.test.js#system triggered
      ui: InvoiceActivityTimeline.test.tsx#System Triggered
      ui: DualTimezoneDateTime.test.tsx#Your local time
    status: covered
    notes: |
      Property billingTimezone (America/New_York for this HOA) is the source of truth.
      Automated reminders/next-year generation run at 12:00 AM property-local time.
      Activity timeline must show System Triggered and must not display browser local time.

invariants:
  - id: INV-INV-001
    rule: Overpayment credit is tied to paymentGroupId on the originating payment
    scenarios: [INV-SC-004, INV-SC-005, INV-SC-008, INV-SC-012, INV-SC-019, INV-SC-020]

  - id: INV-INV-002
    rule: Downstream auto-credit carries sourcePaymentGroupId for reversal tracing
    scenarios: [INV-SC-008, INV-SC-023, INV-SC-024]

  - id: INV-INV-003
    rule: FIFO pays oldest calendar-due outstanding invoice first
    scenarios: [INV-SC-010, INV-SC-011, INV-SC-012, INV-SC-013, INV-SC-014, INV-SC-015, INV-SC-016, INV-SC-017, INV-SC-018, INV-SC-026, INV-SC-028]

