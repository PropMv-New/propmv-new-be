<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>Update notification - PropMv</title>
  <!-- PMV_EMAIL_THEME -->
</head>
<body class="pmv-body">
  <span class="pmv-preheader">{{eventMessage}}</span>
  <table role="presentation" class="pmv-shell" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" class="pmv-shell-pad">
        <table role="presentation" class="pmv-card-table" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td class="pmv-top-accent">&nbsp;</td></tr>
          <tr>
            <td class="pmv-card-inner">
              <!-- PMV_EMAIL_BRAND_HEADER -->

              <span class="pmv-pill">Update</span>
              <h1 class="pmv-title">New update</h1>
              <p class="pmv-greet">Hi {{recipientName}},</p>
              <p class="pmv-text">{{eventMessage}}</p>

              <div class="pmv-info-box pmv-info-box-accent">
                <p class="pmv-muted" style="margin:0;">{{entityLabel}}</p>
              </div>

              <div class="pmv-footer-minimal">This is an automated notification from PropMv.</div>
            </td>
          </tr>
          <tr><td><!-- PMV_EMAIL_BRAND_FOOTER --></td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
