<!doctype html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="color-scheme" content="light dark" />
  <meta name="supported-color-schemes" content="light dark" />
  <title>HOA board access update - PropMv</title>
  <!-- PMV_EMAIL_THEME -->
</head>
<body class="pmv-body">
  <span class="pmv-preheader">{{headline}}</span>
  <table role="presentation" class="pmv-shell" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td align="center" class="pmv-shell-pad">
        <table role="presentation" class="pmv-card-table" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr><td class="pmv-top-accent">&nbsp;</td></tr>
          <tr>
            <td class="pmv-card-inner">
              <!-- PMV_EMAIL_BRAND_HEADER -->

              <span class="pmv-pill">Board access update</span>
              <h1 class="pmv-title">{{headline}}</h1>
              <p class="pmv-greet">Hi {{recipientName}},</p>
              <p class="pmv-text">{{introParagraph}}</p>

              <table class="pmv-details-table" role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td class="pmv-details-label">Community</td>
                  <td class="pmv-details-value">{{hoaName}}</td>
                </tr>
              </table>

              <p class="pmv-text">{{supportParagraph}}</p>

              <table role="presentation" class="pmv-cta-wrap" width="100%" cellpadding="0" cellspacing="0" border="0" align="center">
                <tr>
                  <td align="center">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                      <tr>
                        <td class="pmv-cta-cell" align="center" bgcolor="#f97316">
                          <a href="{{loginUrl}}" class="pmv-cta" target="_blank">Open PropMv</a>
                        </td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>

              <div class="pmv-footer-minimal">This is an automated notification from PropMv.</div>
            </td>
          </tr>
          <tr><td><!-- PMV_EMAIL_BRAND_FOOTER --></td></tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
