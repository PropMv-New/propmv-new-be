<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="pmv-brand-table" style="margin:0 0 20px 0;">
  <tr>
    <td align="left" valign="middle" class="pmv-brand-logo-cell" style="padding:0;width:60%;">
      {{#if logoUrl}}
      <img src="{{logoUrl}}" alt="{{logoAltText}}" width="88" height="19" class="pmv-logo-img" style="display:block;width:88px;max-width:88px;height:auto;border:0;outline:none;text-decoration:none;-ms-interpolation-mode:bicubic;" />
      {{else}}
      <span style="display:inline-block;font-weight:800;font-size:20px;line-height:1.2;color:#f97316;font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif;">{{brandHeaderText}}</span>
      {{/if}}
    </td>
    <td align="right" valign="middle" class="pmv-brand-meta-cell" style="padding:0;width:40%;font-size:11px;line-height:1.4;color:#94a3b8;font-weight:600;">
      Powered by PropMv
    </td>
  </tr>
</table>
